<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mondrian Project</title>
  <style>
    body{
      display: flex;
      justify-content: center;
      align-content: center;

    }
    .container{
      display: grid;
      grid-template-columns: 320px 198px 153px 50px;
      grid-template-rows: 414px 130px 155px 22px;
      height: 748px;
      width: 748px;
      background-color: black;
      gap: 9px;
    }
    .red{
      background-color: red;
    }
    .none1{
      background-color: bisque;

      grid-column: span 3;

    }
    .none2{
      background-color: bisque;
      grid-row: span 2;

    }
    .none3{
      background-color: bisque;
      grid-area: 2 / 2 / 4 /4
    }
    .blue{
      background-color: blue;
      border-bottom: 10px solid black;
    }
    .none4{
      background-color: bisque;
      grid-row: span 2;
    }

    .none5{
      background-color: bisque;
    }
    .yellow {
      background-color: #F9D01E;
    }



    .black {
      background-color: #232629;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="red">  </div>
    <div class="none1">  </div>
    <div class="none2">  </div>
    <div class="none3">  </div>
    <div class="blue">  </div>
    <div class="none4">  </div>
    <div class="none5">  </div>
    <div class="yellow">  </div>
    <div class="black">  </div>
  </div>

</body>

</html>
